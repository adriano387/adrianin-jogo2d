
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Jogo 2D</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="gameContainer">
        <canvas id="gameCanvas" width="900" height="500"></canvas>

        <div id="gameOver" class="hidden">
            <h1>VOCÊ MORREU!</h1>
            <button id="restartButton">JOGAR NOVAMENTE</button>
        </div>
    </div>

   
<div id="botoes-celular">
  <button id="btn-esquerda">⬅️</button>
  <button id="btn-pular">⬆️ PULAR</button>
  <button id="btn-direita">➡️</button>
</div>
   <script src="game.js"></script>
   <audio id="musica" src="msc.mp3" loop></audio>
<button id="btn-musica" style="position: fixed; top: 10px; right: 10px; font-size: 24px; z-index: 9999; padding: 8px 12px; border-radius: 10px; border: none;">🔊 Música</button>

<script>
  let musica = document.getElementById('musica');
  let btnMusica = document.getElementById('btn-musica');
  let tocando = false;

  btnMusica.addEventListener('click', () => {
    if (!tocando) {
      musica.play();
      btnMusica.textContent = '🔇 Parar';
      tocando = true;
    } else {
      musica.pause();
      btnMusica.textContent = '🔊 Música';
      tocando = false;
    }
  });
</script>
</body>
</html>
