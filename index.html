<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>MeuJogo-2d</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; height: 100dvh; background: #000; overflow: hidden; font-family: Arial; touch-action: none; }
  #game { display: block; width: 100vw; height: 100dvh; background: #87CEEB; }
  #placar { position: fixed; top: 8px; left: 10px; font-size: 17px; font-weight: bold; color: #fff; text-shadow: 2px 2px 0 #000; z-index: 10; line-height: 1.25; }
  #aviso { position: fixed; bottom: 12px; width: 100%; text-align: center; color: #fff; font-weight: bold; font-size: 18px; text-shadow: 2px 2px 0 #000; pointer-events: none; z-index: 10; }
  #btnTelaCheia { position: fixed; top: 8px; right: 10px; width: 38px; height: 38px; font-size: 18px; background: rgba(0,0,0,0.5); color: white; border: 2px solid white; border-radius: 8px; z-index: 20; }
  #btnPause { position: fixed; top: 8px; right: 56px; width: 38px; height: 38px; font-size: 18px; background: rgba(0,0,0,0.5); color: white; border: 2px solid white; border-radius: 8px; z-index: 20; }
  #btnSkin { position: fixed; top: 8px; right: 102px; width: 38px; height: 38px; font-size: 18px; background: rgba(0,0,0,0.5); color: white; border: 2px solid white; border-radius: 8px; z-index: 20; }
  #menu { position: fixed; top: 0; left: 0; width: 100%; height: 100%; height: 100dvh; background: rgba(0,0,0,0.75); z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; overflow-y: auto; padding: 20px 0; }
  #menu h1 { color: #fff; font-size: 30px; text-align: center; }
  #menu h1 span { color: #FFD700; }
  #menu p { color: #fff; font-size: 16px; }
  .btnNivel { width: 260px; padding: 13px; font-size: 20px; font-weight: bold; border: none; border-radius: 12px; color: #fff; }
  #btnFacil { background: #2ECC71; }
  #btnMedio { background: #F39C12; }
  #btnDificil { background: #E74C3C; }
  #btnFullMenu { width: 260px; padding: 13px; font-size: 18px; font-weight: bold; background: #fff; color: #000; border: none; border-radius: 12px; }
  #menu small { color: #ddd; text-align: center; padding: 0 20px; line-height: 1.4; }
  #rankingBox { background: rgba(255,255,255,0.15); border: 2px solid #FFD700; border-radius: 12px; padding: 10px 15px; width: 260px; color: #fff; }
  #rankingBox h3 { text-align: center; color: #FFD700; margin-bottom: 6px; font-size: 18px; }
  #listaRanking { list-style: none; font-size: 15px; line-height: 1.6; }
  #listaRanking li { border-bottom: 1px solid rgba(255,255,255,0.2); padding: 2px 0; }
  #telaNome { position: fixed; top: 0; left: 0; width: 100%; height: 100%; height: 100dvh; background: rgba(0,0,0,0.8); z-index: 40; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 20px; }
  #telaNome h2 { color: #FFD700; font-size: 26px; text-align: center; }
  #telaNome p { color: #fff; font-size: 18px; text-align: center; }
  #inputNome { width: 260px; padding: 14px; font-size: 18px; border-radius: 10px; border: none; text-align: center; }
  #btnSalvarNome { width: 260px; padding: 14px; font-size: 18px; font-weight: bold; background: #2ECC71; color: #fff; border: none; border-radius: 10px; }
  #btnPularNome { background: none; border: none; color: #ccc; font-size: 14px; text-decoration: underline; }
</style>
</head>
<body>

<div id="placar">Pontos: 0<br>❤️❤️❤️<br>🏆 Recorde: 0</div>
<button id="btnSkin">🎨</button>
<button id="btnPause">⏸</button>
<button id="btnTelaCheia">⛶</button>
<canvas id="game"></canvas>
<div id="aviso"></div>

<div id="menu">
  <h1>🐶 CACHORRO<br><span>AVENTUREIRO</span></h1>
  <button id="btnFullMenu">⛶ TELA CHEIA</button>
  <p>Escolha a dificuldade:</p>
  <button class="btnNivel" id="btnFacil">😊 FÁCIL</button>
  <button class="btnNivel" id="btnMedio">😬 MÉDIO</button>
  <button class="btnNivel" id="btnDificil">😱 DIFÍCIL</button>
  <div id="rankingBox">
    <h3>🏆 TOP 5 JOGADORES</h3>
    <ul id="listaRanking"><li>Ninguém jogou ainda...</li></ul>
  </div>
  <small>Dica: deixa em tela cheia antes de jogar<br>que some a barra do navegador!</small>
</div>

<div id="telaNome">
  <h2 id="tituloNome">FIM DE JOGO!</h2>
  <p id="textoNome">Você fez 0 pontos!</p>
  <input id="inputNome" type="text" maxlength="12" placeholder="Digite seu nome...">
  <button id="btnSalvarNome">💾 SALVAR MEU NOME</button>
  <button id="btnPularNome">pular sem salvar</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function ajustar() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  chao = canvas.height - Math.max(90, canvas.height * 0.32);
  if (player) player.y = Math.min(player.y, chao - player.h);
  criarCidade();
}
window.addEventListener('resize', ajustar);
window.addEventListener('orientationchange', () => setTimeout(ajustar, 300));
document.addEventListener('fullscreenchange', () => setTimeout(ajustar, 200));

function entrarTelaCheia() {
  if (!document.fullscreenElement) {
    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{});
    else if (document.documentElement.webkitRequestFullscreen) document.documentElement.webkitRequestFullscreen();
  }
}
function sairOuEntrarTelaCheia() {
  if (!document.fullscreenElement) entrarTelaCheia();
  else document.exitFullscreen();
}
document.getElementById('btnTelaCheia').addEventListener('click', function(e) {
  e.stopPropagation();
  sairOuEntrarTelaCheia();
});
document.getElementById('btnFullMenu').addEventListener('click', function(e) {
  e.stopPropagation();
  entrarTelaCheia();
  this.innerText = '✅ TELA CHEIA ATIVA!';
  setTimeout(() => { this.innerText = '⛶ TELA CHEIA'; }, 2000);
});

let pontos = 0;
let recorde = parseInt(localStorage.getItem('recordeCachorro') || '0');
let vidas = 3;
let player = { x: 50, y: 0, w: 52, h: 50, vy: 0, pulando: false, pulos: 0, invencivel: 0 };
let chao = 0;
let obstaculos = [];
let ossos = [];
let particulas = [];
let nuvens = [];
let gameOver = false;
let venceu = false;
let deslocamentoPista = 0;
let tempo = 0;
let pausado = false;
let tela = 'menu';
let tempoIntro = 0;
let meninoX = -60;
let cachorroIntroX = -120;
let coleiraQuebrou = false;
let dificuldade = 'facil';
let tempoSpawn = 0;
let rankingSalvo = false;
let mostrouTelaNome = false;

let skins = [
  { nome: 'Caramelo', corpo: '#D19A5A', orelha: '#8B5A2B' },
  { nome: 'Pretinho', corpo: '#4A4A4A', orelha: '#111111' },
  { nome: 'Branquinho', corpo: '#F5F5F5', orelha: '#D19A5A' },
  { nome: 'Chocolate', corpo: '#8B5A2B', orelha: '#4A2C00' }
];
let skinAtual = 0;

let ranking = JSON.parse(localStorage.getItem('rankingCachorro') || '[]');
function mostrarRanking() {
  let lista = document.getElementById('listaRanking');
  if (ranking.length === 0) { lista.innerHTML = '<li>Ninguém jogou ainda...</li>'; return; }
  let medalhas = ['🥇','🥈','🥉','4️⃣','5️⃣'];
  lista.innerHTML = ranking.map((r, i) => '<li>' + (medalhas[i] || (i+1)+'º') + ' ' + r.nome + ' - ' + r.pontos + ' pts <small>(' + r.nivel + ')</small></li>').join('');
}
mostrarRanking();

function mostrarTelaNome(titulo) {
  if (mostrouTelaNome) return;
  mostrouTelaNome = true;
  document.getElementById('tituloNome').innerText = titulo;
  document.getElementById('textoNome').innerText = 'Você fez ' + pontos + ' pontos no ' + nomeDificuldade() + '!';
  document.getElementById('inputNome').value = localStorage.getItem('ultimoNome') || '';
  document.getElementById('telaNome').style.display = 'flex';
  setTimeout(() => document.getElementById('inputNome').focus(), 100);
}
function fecharTelaNome() {
  document.getElementById('telaNome').style.display = 'none';
  tela = 'menu';
  document.getElementById('menu').style.display = 'flex';
  mostrarRanking();
}
function salvarNome() {
  let nome = document.getElementById('inputNome').value.trim();
  if (!nome) nome = 'Jogador';
  localStorage.setItem('ultimoNome', nome);
  ranking.push({ nome: nome, pontos: pontos, nivel: nomeDificuldade() });
  ranking.sort((a, b) => b.pontos - a.pontos);
  ranking = ranking.slice(0, 5);
  localStorage.setItem('rankingCachorro', JSON.stringify(ranking));
  rankingSalvo = true;
  fecharTelaNome();
}
document.getElementById('btnSalvarNome').addEventListener('click', salvarNome);
document.getElementById('btnPularNome').addEventListener('click', () => { rankingSalvo = true; fecharTelaNome(); });
document.getElementById('inputNome').addEventListener('keydown', function(e) { if (e.key === 'Enter') salvarNome(); });

function escolherNivel(nivel) {
  entrarTelaCheia();
  dificuldade = nivel;
  document.getElementById('menu').style.display = 'none';
  tela = 'inicio';
  tempoIntro = 0;
  meninoX = -60;
  cachorroIntroX = -120;
  coleiraQuebrou = false;
  resetar();
}
document.getElementById('btnFacil').addEventListener('click', () => escolherNivel('facil'));
document.getElementById('btnMedio').addEventListener('click', () => escolherNivel('medio'));
document.getElementById('btnDificil').addEventListener('click', () => escolherNivel('dificil'));

document.getElementById('btnSkin').addEventListener('click', function(e) {
  e.stopPropagation();
  skinAtual = (skinAtual + 1) % skins.length;
  document.getElementById('aviso').innerText = 'Cachorro: ' + skins[skinAtual].nome;
  setTimeout(() => { if (tela === 'jogando') document.getElementById('aviso').innerText = 'TOQUE NA TELA PARA PULAR'; }, 1500);
});

document.getElementById('btnPause').addEventListener('click', function(e) {
  e.stopPropagation();
  if (tela !== 'jogando') return;
  pausado = !pausado;
  this.innerText = pausado ? '▶' : '⏸';
});

function getFase() {
  if (pontos < 120) return 'dia';
  if (pontos < 280) return 'noite';
  return 'amanhecer';
}
function velocidadeJogo() {
  let base = 6 + Math.floor(pontos / 50);
  if (dificuldade === 'medio') base += 1;
  if (dificuldade === 'dificil') base += 1;
  return Math.min(base, 11);
}
function intervaloSpawn() {
  if (dificuldade === 'facil') return 85;
  if (dificuldade === 'medio') return 55;
  return 68;
}
function nomeDificuldade() {
  if (dificuldade === 'facil') return 'FÁCIL';
  if (dificuldade === 'medio') return 'MÉDIO';
  return 'DIFÍCIL';
}

let prediosFundo = [];
let prediosFrente = [];
let postes = [];
let arvores = [];
let estrelas = [];
for (let i = 0; i < 40; i++) estrelas.push({ x: Math.random(), y: Math.random() * 0.4 });
for (let i = 0; i < 5; i++) nuvens.push({ x: Math.random()*800, y: 20 + Math.random()*80, v: 0.5 + Math.random() });

function criarJanelas(w, h) {
  let janelas = [];
  let cols = Math.floor(w / 28);
  let linhas = Math.floor(h / 32);
  for (let ly = 0; ly < linhas; ly++) for (let lx = 0; lx < cols; lx++) janelas.push({ col: lx, linha: ly, acesa: Math.random() < 0.45 });
  return janelas;
}
function criarUmPredio(x, minH, maxH) {
  let largura = 60 + Math.random() * 70;
  let altura = minH + Math.random() * (maxH - minH);
  return { x: x, w: largura, h: altura, janelas: criarJanelas(largura, altura), antena: Math.random() < 0.6 };
}
function criarCidade() {
  prediosFundo = []; prediosFrente = []; postes = []; arvores = [];
  let x = -20;
  while (x < canvas.width + 400) { let p = criarUmPredio(x, 90, 200); prediosFundo.push(p); x += p.w + 10 + Math.random()*20; }
  x = -20;
  while (x < canvas.width + 400) { let p = criarUmPredio(x, 140, 320); prediosFrente.push(p); x += p.w + 8 + Math.random()*25; }
  for (let i = 0; i < 10; i++) { postes.push({ x: i * 220 + 80 + Math.random()*60 }); arvores.push({ x: i * 220 + 180 + Math.random()*60 }); }
}

function atualizarPlacar() {
  let coracoes = '❤️'.repeat(vidas) + '🖤'.repeat(3 - vidas);
  document.getElementById('placar').innerHTML = 'Pontos: ' + pontos + ' / 400<br>' + nomeDificuldade() + ' - ' + coracoes + '<br>🏆 Recorde: ' + recorde;
}

function resetar() {
  player.y = chao - player.h; player.vy = 0; player.pulos = 0; player.invencivel = 0;
  obstaculos = []; ossos = []; particulas = [];
  pontos = 0; vidas = 3; gameOver = false; venceu = false; pausado = false; tempoSpawn = 0;
  rankingSalvo = false; mostrouTelaNome = false;
  document.getElementById('btnPause').innerText = '⏸';
  atualizarPlacar();
}

function pular() {
  if (pausado) return;
  if (tela === 'menu') return;
  if (document.getElementById('telaNome').style.display === 'flex') return;
  if (tela === 'inicio') {
    if (tempoIntro > 300) { tela = 'jogando'; document.getElementById('aviso').innerText = 'TOQUE NA TELA PARA PULAR'; }
    return;
  }
  if (gameOver) { mostrarTelaNome('😢 PERDEU!'); return; }
  if (venceu) { mostrarTelaNome('🎉 VOCÊ VENCEU!'); return; }
  if (player.pulos < 2) {
    player.vy = -16;
    player.pulando = true;
    player.pulos++;
    if (particulas.length < 30) {
      for (let i=0;i<4;i++) particulas.push({ x: player.x+10, y: player.y+40, vx: -2+Math.random()*2, vy: Math.random()*2, vida: 15 });
    }
  }
}

canvas.addEventListener('touchstart', function(e) { e.preventDefault(); pular(); }, {passive: false});
canvas.addEventListener('mousedown', pular);
document.addEventListener('keydown', function(e) {
  if (e.code === 'Space') pular();
  if (e.code === 'KeyP' && tela === 'jogando') { pausado = !pausado; document.getElementById('btnPause').innerText = pausado ? '▶' : '⏸'; }
});

function criarObstaculo() {
  if (tela !== 'jogando' || pausado || gameOver || venceu) return;
  let r = Math.random();
  if (dificuldade === 'dificil' && r < 0.30) {
    obstaculos.push({ x: canvas.width, y: chao - 60, w: 110, h: 60, tipo: 'caminhao', cor: ['#E74C3C','#2980B9','#8E44AD'][Math.floor(Math.random()*3)] });
  } else if (r < 0.5) {
    obstaculos.push({ x: canvas.width, y: chao - 45, w: 70, h: 45, tipo: 'carro', cor: ['#FFD700','#FF4500','#00BFFF','#32CD32'][Math.floor(Math.random()*4)] });
  } else {
    obstaculos.push({ x: canvas.width, y: chao - 85, w: 70, h: 85, tipo: 'casa', cor: ['#FF8C00','#FF69B4','#8A2BE2','#FFF'][Math.floor(Math.random()*4)] });
  }
  if (dificuldade === 'medio' && Math.random() < 0.35) {
    obstaculos.push({ x: canvas.width + 110, y: chao - 45, w: 70, h: 45, tipo: 'carro', cor: ['#FFD700','#FF4500','#00BFFF','#32CD32'][Math.floor(Math.random()*4)] });
  }
  if (dificuldade === 'dificil' && Math.random() < 0.25) {
    obstaculos.push({ x: canvas.width + 190, y: chao - 45, w: 70, h: 45, tipo: 'carro', cor: ['#FFD700','#FF4500','#00BFFF','#32CD32'][Math.floor(Math.random()*4)] });
  }
}

function criarOsso() {
  if (tela !== 'jogando' || pausado || gameOver || venceu) return;
  ossos.push({ x: canvas.width, y: chao - 60 - Math.random()*80, w: 30, h: 20 });
}
setInterval(criarOsso, 2200);

function desenharCarro(o) {
  ctx.fillStyle = o.cor; ctx.fillRect(o.x, o.y + 15, o.w, 30); ctx.fillRect(o.x + 12, o.y, 42, 18);
  ctx.fillStyle = '#B0E0E6'; ctx.fillRect(o.x + 17, o.y + 3, 32, 12);
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(o.x + 16, o.y + 45, 9, 0, Math.PI*2); ctx.arc(o.x + 54, o.y + 45, 9, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(o.x + 16, o.y + 45, 3, 0, Math.PI*2); ctx.arc(o.x + 54, o.y + 45, 3, 0, Math.PI*2); ctx.fill();
}
function desenharCaminhao(o) {
  ctx.fillStyle = o.cor; ctx.fillRect(o.x, o.y + 5, 75, 40);
  ctx.fillStyle = '#FFF'; ctx.fillRect(o.x + 5, o.y + 12, 30, 20);
  ctx.fillStyle = '#2980B9'; ctx.font = 'bold 14px Arial'; ctx.textAlign = 'center'; ctx.fillText('CARGA', o.x + 40, o.y + 27);
  ctx.fillStyle = '#F39C12'; ctx.fillRect(o.x + 75, o.y + 18, 35, 27);
  ctx.fillStyle = '#B0E0E6'; ctx.fillRect(o.x + 82, o.y + 22, 22, 12);
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(o.x + 20, o.y + 60, 10, 0, Math.PI*2); ctx.arc(o.x + 50, o.y + 60, 10, 0, Math.PI*2); ctx.arc(o.x + 92, o.y + 60, 10, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(o.x + 20, o.y + 60, 3, 0, Math.PI*2); ctx.arc(o.x + 50, o.y + 60, 3, 0, Math.PI*2); ctx.arc(o.x + 92, o.y + 60, 3, 0, Math.PI*2); ctx.fill();
}
function desenharCasa(o) {
  ctx.fillStyle = o.cor; ctx.fillRect(o.x, o.y + 30, o.w, 55);
  ctx.fillStyle = '#8B0000'; ctx.beginPath(); ctx.moveTo(o.x - 5, o.y + 32); ctx.lineTo(o.x + o.w/2, o.y); ctx.lineTo(o.x + o.w + 5, o.y + 32); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#5C3317'; ctx.fillRect(o.x + o.w/2 - 10, o.y + 55, 20, 30);
  ctx.fillStyle = '#87CEEB'; ctx.fillRect(o.x + 8, o.y + 40, 14, 14);
}
function desenharOsso(o) {
  ctx.fillStyle = '#FFF'; ctx.save(); ctx.translate(o.x+15, o.y+10); ctx.rotate(Math.sin(tempo*0.1)*0.3);
  ctx.beginPath(); ctx.arc(-8, -5, 5, 0, Math.PI*2); ctx.arc(8, -5, 5, 0, Math.PI*2); ctx.arc(-8, 5, 5, 0, Math.PI*2); ctx.arc(8, 5, 5, 0, Math.PI*2); ctx.fill();
  ctx.fillRect(-8, -4, 16, 8); ctx.restore();
}
function desenharPredio(p, baseY) {
  let fase = getFase();
  let corPredio = fase === 'dia' ? '#8D9AA6' : fase === 'noite' ? '#3D4A52' : '#9A7A8A';
  ctx.fillStyle = corPredio; ctx.fillRect(p.x, baseY - p.h, p.w, p.h);
  if (p.antena) { ctx.fillStyle = '#222'; ctx.fillRect(p.x + p.w/2 - 1, baseY - p.h - 18, 3, 18); }
  ctx.fillStyle = fase === 'dia' ? '#3A4A56' : '#1F2A30'; ctx.fillRect(p.x + p.w/2 - 14, baseY - 32, 28, 32);
  for (let j of p.janelas) {
    let jx = p.x + 10 + j.col * 28; let jy = baseY - p.h + 14 + j.linha * 32;
    if (jx + 16 < p.x + p.w - 6 && jy + 18 < baseY - 38) {
      if (fase === 'noite') ctx.fillStyle = j.acesa ? '#D9B83A' : '#1E2A30';
      else if (fase === 'amanhecer') ctx.fillStyle = j.acesa ? '#FFD700' : '#6B5A6B';
      else ctx.fillStyle = j.acesa ? '#B0E0E6' : '#5B6B7A';
      ctx.fillRect(jx, jy, 16, 18);
    }
  }
}
function desenharPoste(x, baseY) {
  let noite = getFase() === 'noite';
  if (noite) {
    ctx.fillStyle = 'rgba(255, 230, 150, 0.15)'; ctx.beginPath(); ctx.moveTo(x, baseY - 95); ctx.lineTo(x - 45, baseY); ctx.lineTo(x + 45, baseY); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = '#1F2A30'; ctx.fillRect(x - 3, baseY - 100, 6, 100); ctx.fillRect(x - 3, baseY - 100, 22, 5); ctx.fillRect(x + 14, baseY - 100, 4, 12);
  ctx.fillStyle = noite ? '#FFE9A0' : '#CCCCCC'; ctx.fillRect(x + 12, baseY - 95, 16, 6);
  ctx.fillStyle = '#2A363E'; ctx.fillRect(x - 6, baseY - 8, 12, 8);
}
function desenharArvore(x, baseY) {
  ctx.fillStyle = '#6B3F1A'; ctx.fillRect(x - 4, baseY - 30, 8, 30);
  ctx.fillStyle = '#2E9E4A'; ctx.fillRect(x - 22, baseY - 58, 44, 14); ctx.fillRect(x - 16, baseY - 70, 32, 12); ctx.fillRect(x - 8, baseY - 80, 16, 10);
  ctx.fillStyle = '#37B355'; ctx.fillRect(x - 16, baseY - 58, 12, 8); ctx.fillRect(x + 4, baseY - 70, 10, 8);
}
function desenharSolELua() {
  let fase = getFase();
  let x = canvas.width - 80; let y = fase === 'amanhecer' ? 140 : 70;
  if (fase === 'dia') {
    ctx.fillStyle = '#FFF176'; ctx.beginPath(); ctx.arc(x, y, 35, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255, 241, 118, 0.4)'; ctx.beginPath(); ctx.arc(x, y, 48, 0, Math.PI*2); ctx.fill();
  } else if (fase === 'noite') {
    for (let s of estrelas) { ctx.fillStyle = '#FFF'; ctx.fillRect(s.x * canvas.width, s.y * canvas.height, 2, 2); }
    ctx.fillStyle = '#F0F0F0'; ctx.beginPath(); ctx.arc(x, y, 30, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#D0D0D0'; ctx.beginPath(); ctx.arc(x - 8, y - 5, 6, 0, Math.PI*2); ctx.arc(x + 10, y + 8, 4, 0, Math.PI*2); ctx.fill();
  } else {
    ctx.fillStyle = '#FFA500'; ctx.beginPath(); ctx.arc(x, y, 38, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255, 165, 0, 0.4)'; ctx.beginPath(); ctx.arc(x, y, 55, 0, Math.PI*2); ctx.fill();
  }
}
function desenharNuvens() {
  if (getFase() === 'noite') return;
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  for (let n of nuvens) {
    ctx.beginPath(); ctx.arc(n.x, n.y, 18, 0, Math.PI*2); ctx.arc(n.x+20, n.y, 22, 0, Math.PI*2); ctx.arc(n.x+40, n.y, 18, 0, Math.PI*2); ctx.fill();
    if (tela === 'jogando' && !pausado && !gameOver && !venceu) n.x -= n.v;
    if (n.x < -60) { n.x = canvas.width + 40; n.y = 20 + Math.random()*80; }
  }
}
function desenharCidade() {
  let fase = getFase();
  ctx.fillStyle = fase === 'dia' ? '#87CEEB' : fase === 'noite' ? '#2F4A56' : '#FFB6A0';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  desenharSolELua(); desenharNuvens();
  for (let p of prediosFundo) {
    desenharPredio(p, chao - 10);
    if (tela === 'jogando' && !gameOver && !pausado && !venceu) p.x -= 0.5;
    if (p.x + p.w < -20) { let novo = criarUmPredio(canvas.width + 20, 90, 200); p.x = novo.x; p.w = novo.w; p.h = novo.h; p.janelas = novo.janelas; p.antena = novo.antena; }
  }
  for (let p of prediosFrente) {
    desenharPredio(p, chao - 10);
    if (tela === 'jogando' && !gameOver && !pausado && !venceu) p.x -= 1;
    if (p.x + p.w < -20) { let novo = criarUmPredio(canvas.width + 20, 140, 320); p.x = novo.x; p.w = novo.w; p.h = novo.h; p.janelas = novo.janelas; p.antena = novo.antena; }
  }
  ctx.fillStyle = fase === 'noite' ? '#7A8288' : '#A8A8A8'; ctx.fillRect(0, chao - 10, canvas.width, 12);
  for (let poste of postes) { desenharPoste(poste.x, chao - 10); if (tela === 'jogando' && !gameOver && !pausado && !venceu) poste.x -= 1.5; if (poste.x < -60) poste.x = canvas.width + 100 + Math.random()*100; }
  for (let arv of arvores) { desenharArvore(arv.x, chao - 10); if (tela === 'jogando' && !gameOver && !pausado && !venceu) arv.x -= 1.5; if (arv.x < -60) arv.x = canvas.width + 100 + Math.random()*100; }
}
function desenharPista() {
  let fase = getFase();
  let alturaPista = canvas.height - chao;
  ctx.fillStyle = fase === 'noite' ? '#3A3F44' : '#4A4A4A'; ctx.fillRect(0, chao + 2, canvas.width, alturaPista);
  ctx.fillStyle = fase === 'noite' ? '#7A8288' : '#A8A8A8'; ctx.fillRect(0, chao + alturaPista - 14, canvas.width, 14);
  ctx.fillStyle = '#DDE3E6'; let tamanhoTraco = 40; let espaco = 30;
  let yTraco = chao + alturaPista / 2 - 3;
  for (let x = -deslocamentoPista; x < canvas.width; x += tamanhoTraco + espaco) ctx.fillRect(x, yTraco, tamanhoTraco, 6);
  if (tela === 'jogando' && !gameOver && !pausado && !venceu) { deslocamentoPista += velocidadeJogo(); if (deslocamentoPista >= tamanhoTraco + espaco) deslocamentoPista = 0; }
}
function desenharCachorro(x, y, comColeira) {
  let skin = skins[skinAtual];
  let corre = 0;
  if (!player.pulando && !gameOver && !pausado) corre = Math.sin(tempo * 0.25) * 1;
  let balancoRabo = Math.sin(tempo * 0.4) * 6;
  if (player.invencivel > 0 && Math.floor(tempo/8)%2===0) ctx.globalAlpha = 0.7;
  ctx.strokeStyle = skin.corpo; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x + 4, y + 18); ctx.quadraticCurveTo(x - 8, y + 8 + balancoRabo, x - 10, y + balancoRabo); ctx.stroke();
  ctx.fillStyle = '#FFF'; ctx.beginPath(); ctx.arc(x - 10, y + balancoRabo, 4, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = skin.orelha; ctx.fillRect(x + 8, y + 32 + corre, 6, 13 - corre); ctx.fillRect(x + 30, y + 32 - corre, 6, 13 + corre);
  ctx.fillStyle = skin.corpo; ctx.beginPath(); ctx.ellipse(x + 22, y + 22, 22, 15, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#FFF'; ctx.beginPath(); ctx.ellipse(x + 22, y + 28, 12, 7, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = skin.corpo; ctx.beginPath(); ctx.arc(x + 40, y + 12, 15, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = skin.orelha; ctx.beginPath(); ctx.ellipse(x + 32, y + 8, 5, 9, 0.4, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#FFF'; ctx.beginPath(); ctx.ellipse(x + 50, y + 18, 8, 6, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(x + 54, y + 14, 3, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(x + 42, y + 8, 3.5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#FFF'; ctx.beginPath(); ctx.arc(x + 43, y + 7, 1.2, 0, Math.PI*2); ctx.fill();
  if (comColeira) { ctx.fillStyle = '#E74C3C'; ctx.fillRect(x + 28, y + 18, 8, 4); }
  ctx.globalAlpha = 1;
}
function desenharMenino(x, y) {
  let anda = Math.sin(tempo * 0.3) * 3;
  ctx.fillStyle = '#2E86C1'; ctx.fillRect(x + 5, y + 35 + anda, 6, 15 - anda); ctx.fillRect(x + 15, y + 35 - anda, 6, 15 + anda);
  ctx.fillStyle = '#2ECC71'; ctx.fillRect(x, y + 15, 26, 22);
  ctx.fillStyle = '#F5CBA7'; ctx.fillRect(x + 22, y + 18, 14, 6);
  ctx.fillStyle = '#F5CBA7'; ctx.beginPath(); ctx.arc(x + 13, y + 7, 11, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#4A2C00'; ctx.beginPath(); ctx.arc(x + 13, y + 3, 11, Math.PI, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(x + 18, y + 7, 2, 0, Math.PI*2); ctx.fill();
  if (coleiraQuebrou) { ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(x + 20, y + 12, 3, 0, Math.PI*2); ctx.fill(); }
}
function desenharIntro() {
  tempoIntro++;
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  let centroX = canvas.width/2 - 60; let cachorroY = chao - 50; let meninoY = chao - 50;
  if (tempoIntro < 180) {
    meninoX += 1.2; cachorroIntroX = meninoX + 55;
    desenharMenino(meninoX, meninoY); desenharCachorro(cachorroIntroX, cachorroY, true);
    ctx.strokeStyle = '#E74C3C'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(meninoX + 36, meninoY + 20); ctx.lineTo(cachorroIntroX + 30, cachorroY + 20); ctx.stroke();
    ctx.fillStyle = '#FFF'; ctx.font = 'bold 16px Arial'; ctx.textAlign = 'center'; ctx.fillText('Um dia tranquilo passeando...', canvas.width/2, 90);
  } else if (tempoIntro < 240) {
    cachorroIntroX += 1.5; desenharMenino(meninoX, meninoY); desenharCachorro(cachorroIntroX, cachorroY, true);
    ctx.strokeStyle = '#E74C3C'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(meninoX + 36, meninoY + 20); ctx.lineTo(cachorroIntroX + 30, cachorroY + 20); ctx.stroke();
    ctx.fillStyle = '#FFF'; ctx.font = 'bold 18px Arial'; ctx.textAlign = 'center'; ctx.fillText('Ele viu alguma coisa!', canvas.width/2, 90); ctx.fillText('Ele puxou... puxou...', canvas.width/2, 115);
  } else if (tempoIntro < 300) {
    if (!coleiraQuebrou) coleiraQuebrou = true;
    cachorroIntroX += 4; desenharMenino(meninoX, meninoY); desenharCachorro(cachorroIntroX, cachorroY, false);
    ctx.strokeStyle = '#E74C3C'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(meninoX + 36, meninoY + 20); ctx.lineTo(meninoX + 50, meninoY + 28); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cachorroIntroX + 15, cachorroY + 28); ctx.lineTo(cachorroIntroX + 30, cachorroY + 20); ctx.stroke();
    ctx.fillStyle = '#FFD700'; ctx.font = 'bold 24px Arial'; ctx.textAlign = 'center'; ctx.fillText('SNAP! SOLTOU!', canvas.width/2, 90);
  } else {
    if (meninoX > -80) meninoX -= 2; if (meninoX > -60) desenharMenino(meninoX, meninoY);
    if (cachorroIntroX < centroX) cachorroIntroX += 3; if (cachorroIntroX > centroX) cachorroIntroX = centroX;
    let pulo = Math.abs(Math.sin(tempo * 0.2)) * -10; desenharCachorro(cachorroIntroX, cachorroY + pulo, false);
    ctx.textAlign = 'center'; ctx.fillStyle = '#FFF'; ctx.font = 'bold 36px Arial'; ctx.fillText('CACHORRO', canvas.width/2, canvas.height/2 - 120);
    ctx.fillStyle = '#FFD700'; ctx.font = 'bold 36px Arial'; ctx.fillText('AVENTUREIRO', canvas.width/2, canvas.height/2 - 80);
    ctx.fillStyle = '#FFF'; ctx.font = '16px Arial'; ctx.fillText('Ele fugiu e agora vai correr pela cidade!', canvas.width/2, canvas.height/2 - 50);
    ctx.fillStyle = '#FFD700'; ctx.font = 'bold 16px Arial'; ctx.fillText('Modo: ' + nomeDificuldade(), canvas.width/2, canvas.height/2 - 25);
    if (Math.floor(tempo / 30) % 2 === 0) { ctx.fillStyle = '#FFD700'; ctx.font = 'bold 20px Arial'; ctx.fillText('👆 TOQUE PARA COMEÇAR', canvas.width/2, canvas.height - 120); }
  }
}
function atualizar() {
  if (pausado) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 36px Arial'; ctx.textAlign = 'center'; ctx.fillText('⏸ PAUSADO', canvas.width/2, canvas.height/2 - 10);
    ctx.font = '16px Arial'; ctx.fillText('Aperte ▶ para continuar', canvas.width/2, canvas.height/2 + 25);
    requestAnimationFrame(atualizar); return;
  }
  tempo++;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  desenharCidade(); desenharPista();
  if (tela === 'menu') {
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  } else if (tela === 'inicio') {
    document.getElementById('aviso').innerText = ''; desenharIntro();
  } else if (venceu) {
    desenharCachorro(player.x, player.y, false);
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    desenharMenino(canvas.width/2 - 90, chao - 50);
    desenharCachorro(canvas.width/2 - 20, chao - 50, true);
    ctx.fillStyle = '#FFD700'; ctx.font = 'bold 28px Arial'; ctx.textAlign = 'center'; ctx.fillText('🎉 FINAL FELIZ! 🎉', canvas.width/2, canvas.height/2 - 110);
    ctx.fillStyle = '#fff'; ctx.font = '18px Arial'; ctx.fillText('O menino achou o cachorro!', canvas.width/2, canvas.height/2 - 80);
    ctx.fillText('Você fez ' + pontos + ' pontos no ' + nomeDificuldade() + '!', canvas.width/2, canvas.height/2 - 55);
    ctx.fillStyle = '#FFD700'; ctx.font = 'bold 18px Arial'; ctx.fillText('Toque para salvar seu nome', canvas.width/2, canvas.height - 100);
  } else {
    if (player.invencivel > 0) player.invencivel--;
    player.vy += 0.8; player.y += player.vy;
    if (player.y >= chao - player.h) { player.y = chao - player.h; player.vy = 0; player.pulando = false; player.pulos = 0; }
    if (!player.pulando && particulas.length < 30 && Math.random() < 0.5) particulas.push({ x: player.x, y: player.y + 42, vx: -2 - Math.random()*2, vy: -1 + Math.random(), vida: 15 });
    for (let i = particulas.length - 1; i >= 0; i--) {
      let pt = particulas[i]; pt.x += pt.vx; pt.y += pt.vy; pt.vida--;
      ctx.fillStyle = 'rgba(180,180,180,0.6)'; ctx.beginPath(); ctx.arc(pt.x, pt.y, 3, 0, Math.PI*2); ctx.fill();
      if (pt.vida <= 0) particulas.splice(i, 1);
    }
    desenharCachorro(player.x, player.y, false);
    let vel = velocidadeJogo();
    tempoSpawn++;
    if (tempoSpawn >= intervaloSpawn()) { criarObstaculo(); tempoSpawn = 0; }
    for (let i = 0; i < obstaculos.length; i++) {
      let o = obstaculos[i]; o.x -= vel;
      if (o.tipo === 'carro') desenharCarro(o);
      else if (o.tipo === 'caminhao') desenharCaminhao(o);
      else desenharCasa(o);
      if (player.invencivel === 0 && player.x < o.x + o.w && player.x + player.w > o.x && player.y < o.y + o.h && player.y + player.h > o.y) {
        vidas--; player.invencivel = 90; atualizarPlacar();
        if (vidas <= 0) gameOver = true;
      }
      if (o.x + o.w < 0) {
        obstaculos.splice(i, 1); i--; pontos++; atualizarPlacar();
        if (pontos === 120) { document.getElementById('aviso').innerText = 'VIROU NOITE! 🌙'; setTimeout(() => { if (tela === 'jogando') document.getElementById('aviso').innerText = 'TOQUE NA TELA PARA PULAR'; }, 2000); }
        if (pontos === 280) { document.getElementById('aviso').innerText = 'AMANHECEU! 🌅'; setTimeout(() => { if (tela === 'jogando') document.getElementById('aviso').innerText = 'TOQUE NA TELA PARA PULAR'; }, 2000); }
        if (pontos >= 400 && !venceu) { venceu = true; }
        if (pontos > recorde) { recorde = pontos; localStorage.setItem('recordeCachorro', recorde); atualizarPlacar(); }
      }
    }
    for (let i = ossos.length - 1; i >= 0; i--) {
      let o = ossos[i]; o.x -= vel; desenharOsso(o);
      if (player.x < o.x + o.w && player.x + player.w > o.x && player.y < o.y + o.h && player.y + player.h > o.y) {
        ossos.splice(i, 1); pontos += 2; atualizarPlacar();
        if (pontos >= 400 && !venceu) { venceu = true; }
        if (pontos > recorde) { recorde = pontos; localStorage.setItem('recordeCachorro', recorde); atualizarPlacar(); }
        continue;
      }
      if (o.x + o.w < 0) ossos.splice(i, 1);
    }
    if (gameOver) {
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fff'; ctx.font = '30px Arial'; ctx.textAlign = 'center'; ctx.fillText('PERDEU!', canvas.width/2, canvas.height/2 - 10);
      ctx.font = '18px Arial'; ctx.fillText('Fez ' + pontos + ' pontos no ' + nomeDificuldade() + '! Recorde: ' + recorde, canvas.width/2, canvas.height/2 + 20);
      ctx.fillText('Toque na tela para salvar seu nome', canvas.width/2, canvas.height/2 + 50);
    }
  }
  requestAnimationFrame(atualizar);
}
ajustar();
criarCidade();
resetar();
atualizar();
</script>
