<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MeuJogo-2d</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #87CEEB; overflow: hidden; font-family: Arial; touch-action: none; }
  #game { display: block; width: 100vw; height: 100vh; background: #87CEEB; }
  #placar { position: fixed; top: 10px; left: 10px; font-size: 22px; font-weight: bold; color: #fff; text-shadow: 2px 2px 0 #000; z-index: 10; }
  #aviso { position: fixed; bottom: 20px; width: 100%; text-align: center; color: #fff; font-weight: bold; text-shadow: 1px 1px 0 #000; }
</style>
</head>
<body>

<div id="placar">Pontos: 0</div>
<canvas id="game"></canvas>
<div id="aviso">TOQUE NA TELA PARA PULAR</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function ajustar() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
ajustar();
window.addEventListener('resize', ajustar);

let pontos = 0;
let player = { x: 50, y: 0, w: 40, h: 50, vy: 0, pulando: false };
let chao = 0;
let obstaculos = [];
let gameOver = false;

function resetar() {
  chao = canvas.height - 80;
  player.y = chao - player.h;
  player.vy = 0;
  obstaculos = [];
  pontos = 0;
  gameOver = false;
  document.getElementById('placar').innerText = 'Pontos: 0';
}

resetar();

function pular() {
  if (gameOver) { resetar(); return; }
  if (!player.pulando) {
    player.vy = -16;
    player.pulando = true;
  }
}

// AQUI É O SEGREDO: CLICOU / TOCOU NA TELA = PULA
// Sem nenhum botão!
canvas.addEventListener('touchstart', function(e) {
  e.preventDefault();
  pular();
}, {passive: false});

canvas.addEventListener('mousedown', pular);
document.addEventListener('keydown', function(e) {
  if (e.code === 'Space') pular();
});

function criarObstaculo() {
  let altura = 30 + Math.random() * 40;
  obstaculos.push({ x: canvas.width, y: chao - altura, w: 30, h: altura });
}

setInterval(() => {
  if (!gameOver) criarObstaculo();
}, 1400);

function atualizar() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // chão
  ctx.fillStyle = '#2ecc71';
  ctx.fillRect(0, chao + player.h, canvas.width, 80);

  // gravidade
  player.vy += 0.8;
  player.y += player.vy;
  if (player.y >= chao - player.h) {
    player.y = chao - player.h;
    player.vy = 0;
    player.pulando = false;
  }

  // jogador
  ctx.fillStyle = '#e74c3c';
  ctx.fillRect(player.x, player.y, player.w, player.h);
  // olhinho
  ctx.fillStyle = '#fff';
  ctx.fillRect(player.x + 25, player.y + 10, 10, 10);

  // obstáculos
  for (let i = 0; i < obstaculos.length; i++) {
    let o = obstaculos[i];
    o.x -= 6;
    ctx.fillStyle = '#333';
    ctx.fillRect(o.x, o.y, o.w, o.h);

    // colisão
    if (player.x < o.x + o.w && player.x + player.w > o.x &&
        player.y < o.y + o.h && player.y + player.h > o.y) {
      gameOver = true;
    }
    if (o.x + o.w < 0) {
      obstaculos.splice(i, 1);
      i--;
      pontos++;
      document.getElementById('placar').innerText = 'Pontos: ' + pontos;
    }
  }

  if (gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff';
    ctx.font = '30px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('PERDEU!', canvas.width/2, canvas.height/2 - 10);
    ctx.font = '18px Arial';
    ctx.fillText('Toque na tela para jogar de novo', canvas.width/2, canvas.height/2 + 25);
  }

  requestAnimationFrame(atualizar);
}
atualizar();
</script>
</body>
</html>
